<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God's Church for the Homeless — Sign In</title>
  <style>
    /* RESET & CORE STYLING */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* FULL SCREEN SACRED ARTWORK BACKGROUND */
      background: #0d1117 url('church-logo.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      padding: 20px;
      overflow-y: auto;
      position: relative;
    }

    /* SUBTLE VIGNETTE TO KEEP EDGES CLEAN */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.45) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* CENTERED CONTAINER */
    .login-container {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
    }

    /* TRANSLUCENT FROSTED GLASS CARD */
    .auth-card {
      width: 100%;
      background: rgba(12, 17, 24, 0.58); /* Translucent so the background art shines right through */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 18px;
      padding: 34px 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .card-heading {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 22px;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* INPUT FIELDS */
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #e2e8f0;
      margin-bottom: 6px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .form-input {
      width: 100%;
      padding: 13px 15px;
      background: rgba(8, 12, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9px;
      color: #ffffff;
      font-size: 0.98rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      border-color: #d4a017;
      box-shadow: 0 0 12px rgba(212, 160, 23, 0.45);
      background: rgba(8, 12, 18, 0.92);
    }

    /* PASSWORD MATCH STATUS */
    .match-status {
      font-size: 0.8rem;
      margin-top: 5px;
      min-height: 18px;
      font-weight: 600;
    }

    .match-success {
      color: #48bb78;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .match-error {
      color: #fc8181;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* THE SINGLE LOG IN BUTTON */
    .btn-submit {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: linear-gradient(135deg, #d4a017 0%, #b8860b 100%);
      color: #0b0e14;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #e6b12a 0%, #c9940f 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(212, 160, 23, 0.45);
    }

    .btn-submit:disabled {
      background: #4a5568;
      color: #a0aec0;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* SECONDARY ACTION LINKS */
    .links-tray {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.88rem;
    }

    .link-action {
      color: #e2e8f0;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }

    .link-action:hover {
      color: #d4a017;
      text-decoration: underline;
    }

    /* NOTICE / STATUS MESSAGES */
    .message-banner {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.86rem;
      margin-bottom: 16px;
      line-height: 1.4;
      text-align: left;
    }

    .message-info {
      background: rgba(30, 64, 175, 0.6);
      border: 1px solid #3b82f6;
      color: #ffffff;
    }

    .message-success {
      background: rgba(22, 101, 52, 0.7);
      border: 1px solid #22c55e;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- TRANSLUCENT FROSTED CARD -->
    <div class="auth-card">
      <div id="messageBanner" class="message-banner"></div>
      
      <!-- HEADING -->
      <h2 id="cardTitle" class="card-heading">Sign In</h2>

      <!-- FORM -->
      <form id="authForm" onsubmit="handleFormSubmit(event)">
        
        <!-- USERNAME -->
        <div class="form-group" id="groupUsername">
          <label class="form-label" for="usernameInput" id="labelUsername">Username</label>
          <input type="text" id="usernameInput" class="form-input" placeholder="Enter your username" autocomplete="username" required>
        </div>

        <!-- EMAIL (FOR RECOVERY ONLY) -->
        <div class="form-group" id="groupEmail" style="display: none;">
          <label class="form-label" for="emailInput">Account Email Address</label>
          <input type="email" id="emailInput" class="form-input" placeholder="name@example.com" autocomplete="email">
        </div>

        <!-- PASSWORD -->
        <div class="form-group" id="groupPassword">
          <label class="form-label" for="passwordInput" id="labelPassword">Password</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <!-- CONFIRM PASSWORD (MATCHING REQUIRED) -->
        <div class="form-group" id="groupConfirmPassword" style="display: none;">
          <label class="form-label" for="confirmPasswordInput">Confirm Password</label>
          <input type="password" id="confirmPasswordInput" class="form-input" placeholder="Type password again to match" autocomplete="new-password">
          <div id="matchNotice" class="match-status"></div>
        </div>

        <!-- SINGLE LOG IN BUTTON -->
        <button type="submit" id="submitBtn" class="btn-submit">Log In</button>
      </form>

      <!-- LINKS TRAY -->
      <div class="links-tray">
        <a id="toggleCreateLink" class="link-action" onclick="setMode('CREATE')">Make an Account</a>
        <a id="toggleForgotLink" class="link-action" onclick="setMode('FORGOT')">Forgot Username or Password?</a>
        <a id="toggleBackToLoginLink" class="link-action" style="display: none;" onclick="setMode('LOGIN')">Back to Sign In</a>
      </div>

    </div>

  </div>

  <script>
    /* APPLICATION STATE MODES: 'LOGIN' | 'CREATE' | 'FORGOT' | 'RESET' */
    let currentMode = 'LOGIN';

    const cardTitle = document.getElementById('cardTitle');
    const authForm = document.getElementById('authForm');
    const groupUsername = document.getElementById('groupUsername');
    const labelUsername = document.getElementById('labelUsername');
    const usernameInput = document.getElementById('usernameInput');
    const groupEmail = document.getElementById('groupEmail');
    const emailInput = document.getElementById('emailInput');
    const groupPassword = document.getElementById('groupPassword');
    const labelPassword = document.getElementById('labelPassword');
    const passwordInput = document.getElementById('passwordInput');
    const groupConfirmPassword = document.getElementById('groupConfirmPassword');
    const confirmPasswordInput = document.getElementById('confirmPasswordInput');
    const matchNotice = document.getElementById('matchNotice');
    const submitBtn = document.getElementById('submitBtn');

    const toggleCreateLink = document.getElementById('toggleCreateLink');
    const toggleForgotLink = document.getElementById('toggleForgotLink');
    const toggleBackToLoginLink = document.getElementById('toggleBackToLoginLink');
    const messageBanner = document.getElementById('messageBanner');

    function showBanner(text, type = 'info') {
      messageBanner.style.display = 'block';
      messageBanner.className = 'message-banner ' + (type === 'success' ? 'message-success' : 'message-info');
      messageBanner.innerHTML = text;
    }

    function clearBanner() {
      messageBanner.style.display = 'none';
      messageBanner.innerHTML = '';
    }

    /* SWITCH MODES */
    function setMode(mode) {
      currentMode = mode;
      clearBanner();
      matchNotice.textContent = '';
      submitBtn.disabled = false;

      if (mode === 'LOGIN') {
        cardTitle.textContent = "Sign In";
        groupUsername.style.display = "block";
        labelUsername.textContent = "Username";
        usernameInput.placeholder = "Enter your username";
        usernameInput.required = true;

        groupEmail.style.display = "none";
        emailInput.required = false;

        groupPassword.style.display = "block";
        labelPassword.textContent = "Password";
        passwordInput.placeholder = "Enter your password";
        passwordInput.required = true;

        groupConfirmPassword.style.display = "none";
        confirmPasswordInput.required = false;

        submitBtn.textContent = "Log In";

        toggleCreateLink.style.display = "block";
        toggleForgotLink.style.display = "block";
        toggleBackToLoginLink.style.display = "none";
      } 
      else if (mode === 'CREATE') {
        cardTitle.textContent = "Make an Account";
        groupUsername.style.display = "block";
        labelUsername.textContent = "Choose Username";
        usernameInput.placeholder = "Choose your username";
        usernameInput.required = true;

        groupEmail.style.display = "none";
        emailInput.required = false;

        groupPassword.style.display = "block";
        labelPassword.textContent = "Create Password";
        passwordInput.placeholder = "Create a password";
        passwordInput.required = true;

        groupConfirmPassword.style.display = "block";
        confirmPasswordInput.required = true;

        submitBtn.textContent = "Log In";
        submitBtn.disabled = true;

        toggleCreateLink.style.display = "none";
        toggleForgotLink.style.display = "none";
        toggleBackToLoginLink.style.display = "block";
      } 
      else if (mode === 'FORGOT') {
        cardTitle.textContent = "Recover Account";
        groupUsername.style.display = "none";
        usernameInput.required = false;

        groupEmail.style.display = "block";
        emailInput.required = true;

        groupPassword.style.display = "none";
        passwordInput.required = false;

        groupConfirmPassword.style.display = "none";
        confirmPasswordInput.required = false;

        submitBtn.textContent = "Send Verification Link";

        toggleCreateLink.style.display = "none";
        toggleForgotLink.style.display = "none";
        toggleBackToLoginLink.style.display = "block";
      } 
      else if (mode === 'RESET') {
        cardTitle.textContent = "Update Username & Password";
        groupUsername.style.display = "block";
        labelUsername.textContent = "Verified Username";
        usernameInput.required = true;

        groupEmail.style.display = "none";
        emailInput.required = false;

        groupPassword.style.display = "block";
        labelPassword.textContent = "New Password";
        passwordInput.placeholder = "Enter new password";
        passwordInput.required = true;

        groupConfirmPassword.style.display = "block";
        confirmPasswordInput.required = true;

        submitBtn.textContent = "Log In";
        submitBtn.disabled = true;

        toggleCreateLink.style.display = "none";
        toggleForgotLink.style.display = "none";
        toggleBackToLoginLink.style.display = "block";
      }
    }

    /* REAL-TIME MATCHING PASSWORD VERIFICATION */
    function checkPasswordsMatch() {
      if (currentMode === 'CREATE' || currentMode === 'RESET') {
        const p1 = passwordInput.value;
        const p2 = confirmPasswordInput.value;

        if (p2.length === 0) {
          matchNotice.textContent = '';
          submitBtn.disabled = true;
          return;
        }

        if (p1 === p2 && p1.length > 0) {
          matchNotice.textContent = "✓ Passwords match";
          matchNotice.className = "match-status match-success";
          submitBtn.disabled = false;
        } else {
          matchNotice.textContent = "✕ Passwords do not match yet";
          matchNotice.className = "match-status match-error";
          submitBtn.disabled = true;
        }
      }
    }

    passwordInput.addEventListener('input', checkPasswordsMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordsMatch);

    /* FORM SUBMISSION & ROUTING LOGIC */
    function handleFormSubmit(event) {
      event.preventDefault();

      const user = usernameInput.value.trim().toLowerCase();

      /* 1. FORGOT RECOVERY FLOW */
      if (currentMode === 'FORGOT') {
        const email = emailInput.value.trim();
        showBanner(`A verification link has been sent to <strong>${email}</strong>.<br><br><a href="#" onclick="openResetScreen('${email}')" style="color:#d4a017; font-weight:bold;">[ Click here to simulate email link ]</a>`, 'info');
        return;
      }

      /* 2. BROTHER BRIAN'S MASTER ACCESS (AUTO-TELEPORT TO COMMAND STUDIO) */
      if (user === 'brother brian' || user === 'brotherbrian' || user === 'brian' || user === 'pastor brian') {
        showBanner("<strong>Welcome, Brother Brian.</strong> Master credentials recognized. Teleporting straight into your Backstage Studio...", "success");
        setTimeout(() => {
          window.location.href = "backstage-studio.html";
        }, 1200);
        return;
      }

      /* 3. REGULAR MEMBER / FLOCK LOGIN (GOES DIRECTLY TO LOBBY) */
      showBanner(`<strong>Welcome home!</strong> Entering God's Church for the Homeless Lobby...`, "success");
      setTimeout(() => {
        window.location.href = "lobby.html";
      }, 1200);
    }

    /* SIMULATION FUNCTION: OPENS THE RESET SCREEN DIRECTLY FROM EMAIL LINK */
    function openResetScreen(simulatedEmail) {
      setMode('RESET');
      usernameInput.value = "Member_" + Math.floor(100 + Math.random() * 900);
      showBanner("Identity verified via email. Set your confirmed password below to log in.", "success");
    }
  </script>
</body>
</html>
