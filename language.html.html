<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God's Church for the Homeless — Select Language</title>
  <style>
    /* RESET & CORE STYLING */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 30%, #1e2631 0%, #0d1117 100%);
      color: #ffffff;
      padding: 20px;
      overflow-y: auto;
    }

    /* CENTERED CONTAINER */
    .language-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* TRANSLUCENT FROSTED GLASS CARD */
    .language-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 40px 30px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* MAIN QUESTION */
    .card-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.3;
      margin-bottom: 12px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .card-subtitle {
      font-size: 0.92rem;
      color: #cbd5e0;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* SELECT DROPDOWN */
    .select-wrapper {
      margin-bottom: 26px;
      text-align: left;
    }

    .select-label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #d4a017; /* Amber Gold */
      margin-bottom: 8px;
      font-weight: 700;
    }

    .language-select {
      width: 100%;
      padding: 14px 16px;
      background: #0d1117;
      border: 1.5px solid rgba(212, 160, 23, 0.4);
      border-radius: 10px;
      color: #ffffff;
      font-size: 1.05rem;
      outline: none;
      cursor: pointer;
      transition: all 0.25s ease;
      appearance: auto;
    }

    .language-select:focus {
      border-color: #d4a017;
      box-shadow: 0 0 12px rgba(212, 160, 23, 0.45);
    }

    .language-select option {
      background: #0d1117;
      color: #ffffff;
      padding: 10px;
    }

    /* ACTION BUTTON */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #d4a017 0%, #b8860b 100%);
      color: #0b0e14;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(212, 160, 23, 0.35);
      text-transform: uppercase;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #e6b12a 0%, #c9940f 100%);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(212, 160, 23, 0.45);
    }

    /* PRIVACY FOOTER */
    .footer-note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #a0aec0;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="language-container">
    
    <div class="language-card">
      
      <!-- MAIN QUESTION -->
      <h1 class="card-title">WHAT LANGUAGE DO YOU SPEAK?</h1>
      <p class="card-subtitle">Select your native language so you can read, navigate, and hear God's Word in your own tongue.</p>

      <!-- 25 LANGUAGES DROPDOWN -->
      <div class="select-wrapper">
        <label class="select-label" for="languageSelect">Your Preferred Language</label>
        <select id="languageSelect" class="language-select">
          <option value="en" selected>English</option>
          <option value="es">Español (Spanish)</option>
          <option value="zh">中文 (Mandarin Chinese)</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="ar">العربية (Arabic)</option>
          <option value="fr">Français (French)</option>
          <option value="pt">Português (Portuguese)</option>
          <option value="ru">Русский (Russian)</option>
          <option value="bn">বাংলা (Bengali)</option>
          <option value="de">Deutsch (German)</option>
          <option value="ja">日本語 (Japanese)</option>
          <option value="sw">Kiswahili (Swahili)</option>
          <option value="vi">Tiếng Việt (Vietnamese)</option>
          <option value="tl">Tagalog (Filipino)</option>
          <option value="ko">한국어 (Korean)</option>
          <option value="it">Italiano (Italian)</option>
          <option value="tr">Türkçe (Turkish)</option>
          <option value="uk">Українська (Ukrainian)</option>
          <option value="pl">Polski (Polish)</option>
          <option value="nl">Nederlands (Dutch)</option>
          <option value="no">Norsk (Norwegian)</option>
          <option value="he">עברית (Hebrew)</option>
          <option value="el">Ελληνικά (Greek)</option>
          <option value="iu">ᐃᓄᒃᑎᑐᑦ (Inuktitut / Arctic Native)</option>
          <option value="chr">ᏣᎳᎩ (Cherokee / Native American)</option>
        </select>
      </div>

      <!-- CONTINUE BUTTON -->
      <button type="button" class="btn-submit" onclick="confirmLanguage()">Confirm Language &amp; Continue</button>

      <p class="footer-note">Your preference will be remembered permanently. You can change it anytime in your settings.</p>

    </div>

  </div>

  <script>
    function confirmLanguage() {
      const selected = document.getElementById('languageSelect').value;
      
      // Permanently save choice in browser memory
      localStorage.setItem('church_user_lang', selected);
      
      // Automatically moves to the Lobby
      window.location.href = "lobby.html";
    }
  </script>

</body>
</html>
